<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PW LIVE PLAYER</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root {
    --bg:#0b0f1a; --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.1);
    --accent:#6c5ce7; --accent2:#00d2ff; --text:#e5e7eb; --muted:#9ca3af;
    --danger:#ff5470; --ok:#2dd4a7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    background:radial-gradient(900px 500px at 20% -10%, rgba(108,92,231,.22), transparent 60%),
               radial-gradient(800px 400px at 110% 0%, rgba(0,210,255,.13), transparent 60%),
               var(--bg);
    color:var(--text); min-height:100vh;
    display:flex; flex-direction:column;
}

/* ── Header ── */
header {
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:rgba(11,15,26,.75); backdrop-filter:blur(12px);
    position:sticky; top:0; z-index:50;
}
.brand { display:flex; align-items:center; gap:12px; }
.logo {
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center; font-size:16px;
    box-shadow:0 4px 16px rgba(108,92,231,.45);
}
.brand h1 { font-size:17px; font-weight:700; letter-spacing:.5px; }
.brand small { display:block; font-size:11px; color:var(--muted); font-weight:400; }

.live-badge { display:none; align-items:center; gap:7px; padding:5px 13px; border-radius:999px;
    background:rgba(255,45,45,.12); border:1px solid rgba(255,45,45,.4); }
.live-badge.show { display:flex; }
.live-dot { width:8px; height:8px; background:#ff2d2d; border-radius:50%; animation:blink 1s infinite; box-shadow:0 0 8px #ff2d2d; }
@keyframes blink { 50% { opacity:.25; } }
.live-badge span { font-size:11px; font-weight:700; letter-spacing:1px; color:#ff5c5c; }

/* ── Main ── */
main { flex:1; display:flex; flex-direction:column; align-items:center; padding:22px 16px 40px; }
.class-title { font-size:15px; color:var(--muted); margin-bottom:14px; text-align:center;
    max-width:900px; word-break:break-word; }

/* ── Player shell ── */
.shell {
    position:relative; width:100%; max-width:960px; aspect-ratio:16/9;
    background:#000; border-radius:16px; overflow:hidden;
    border:1px solid var(--border); box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }

/* ── Overlay (loading / ended / error) ── */
.overlay {
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; text-align:center;
    background:rgba(5,8,15,.85); padding:24px;
}
.overlay.hidden { display:none; }
.spinner { width:44px; height:44px; border-radius:50%;
    border:3px solid rgba(255,255,255,.1); border-top-color:var(--accent2);
    animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.overlay .msg { font-size:14px; color:var(--muted); max-width:420px; }
.overlay .msg.error { color:var(--danger); }

.ended-title { font-size:22px; font-weight:700; }
.ended-sub { font-size:13px; color:var(--muted); }
.action-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
.big-btn {
    display:inline-flex; align-items:center; gap:9px; padding:14px 28px;
    border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
    text-decoration:none; color:#fff; transition:transform .15s, box-shadow .2s;
}
.big-btn:active { transform:scale(.96); }
.big-btn.watch { background:linear-gradient(135deg, var(--accent), #8e7bff); box-shadow:0 6px 22px rgba(108,92,231,.45); }
.big-btn.download { background:linear-gradient(135deg, #0088cc, #00c2ff); box-shadow:0 6px 22px rgba(0,150,220,.45); }

/* ── Custom control bar ── */
.controls {
    position:absolute; left:0; right:0; bottom:0; z-index:15;
    display:flex; flex-direction:column; gap:8px; padding:10px 14px;
    background:linear-gradient(transparent, rgba(0,0,0,.75));
    opacity:0; transition:opacity .25s;
}
.shell:hover .controls, .controls.force-show { opacity:1; }
.controls-top { display:flex; justify-content:flex-end; }
.controls-bottom { display:flex; align-items:center; gap:10px; }
.cbtn {
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    color:#fff; border-radius:8px; width:38px; height:38px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    flex-shrink:0; transition:background .2s;
}
.cbtn:hover { background:rgba(255,255,255,.25); }
.progress-wrap { flex:1; height:5px; background:rgba(255,255,255,.18); border-radius:99px; cursor:pointer; position:relative; }
.progress-wrap:hover { height:7px; margin-top:-1px; }
.progress-bar { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent2)); border-radius:99px; width:0%; pointer-events:none; }
.buffering-pill {
    position:absolute; top:14px; left:14px; z-index:16; display:none;
    align-items:center; gap:7px; padding:5px 12px; border-radius:999px;
    background:rgba(0,0,0,.55); backdrop-filter:blur(6px); font-size:11px; color:#e5e7eb;
}
.buffering-pill.show { display:flex; }
.buffering-pill .mini-spin { width:11px; height:11px; border-radius:50%;
    border:2px solid rgba(255,255,255,.25); border-top-color:#fff; animation:spin .7s linear infinite; }
.time-label { font-size:11.5px; color:#d1d5db; min-width:70px; text-align:center; flex-shrink:0; }
.go-live {
    padding:0 14px; height:30px; border:none; border-radius:999px;
    background:rgba(255,45,45,.92); color:#fff; font-size:11px; font-weight:700;
    letter-spacing:1px; cursor:pointer; display:flex; align-items:center; gap:6px;
    flex-shrink:0; transition:background .2s, box-shadow .2s;
    box-shadow:0 4px 14px rgba(255,45,45,.4);
}
.go-live:hover { background:#ff2d2d; }
.go-live.at-live { background:rgba(255,255,255,.16); box-shadow:none; }
.go-live .gdot { width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1s infinite; }
.go-live.at-live .gdot { animation:none; }

footer { text-align:center; color:var(--muted); font-size:11.5px; padding:14px; }

/* ── Recorded (Watch Online) badge — green dot, LIVE badge reused ── */
.live-badge.recorded { background:rgba(45,212,167,.12); border-color:rgba(45,212,167,.4); }
.live-badge.recorded .live-dot { background:var(--ok); box-shadow:0 0 8px var(--ok); animation:none; }
.live-badge.recorded span { color:var(--ok); }

/* ── Secret owner-dashboard access icon (bottom-right, disguised as a
   "doubt/formula" helper icon so students don't suspect anything) ── */
.doubt-fab {
    position:fixed; right:18px; bottom:18px; z-index:200;
    width:46px; height:46px; border-radius:50%;
    background:linear-gradient(135deg,#2b6fef,#00c2ff);
    border:none; color:#fff; font-size:19px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(43,111,239,.5); cursor:pointer;
}
.doubt-fab:active { transform:scale(.94); }

.dmodal { position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center;
    background:rgba(5,8,15,.75); padding:20px; }
.dmodal.hidden { display:none; }
.dmodal-card { background:#141a2b; border:1px solid var(--border); border-radius:14px; padding:26px 22px;
    max-width:340px; width:100%; text-align:center; }
.dmodal-card h2 { font-size:16px; margin-bottom:20px; font-weight:700; }
.dmodal-actions { display:flex; gap:10px; justify-content:center; }
.dmodal-btn { flex:1; padding:11px; border-radius:9px; border:none; font-weight:700; cursor:pointer; font-size:14px; }
.dmodal-btn.yes { background:linear-gradient(135deg,var(--accent),#8e7bff); color:#fff; }
.dmodal-btn.no { background:rgba(255,255,255,.12); color:#fff; }
</style>
</head>
<body>

<header>
    <div class="brand">
        <div class="logo">▶</div>
        <div>
            <h1>PW LIVE PLAYER</h1>
            <small>Premium Server</small>
        </div>
    </div>
    <div class="live-badge" id="liveBadge">
        <div class="live-dot"></div><span>LIVE</span>
    </div>
</header>

<main>
    <div class="class-title" id="classTitle">{{ title }}</div>

    <div class="shell" id="shell">
        <video id="video" playsinline></video>

        <div class="buffering-pill" id="bufferingPill"><div class="mini-spin"></div><span>Buffering…</span></div>

        <!-- Custom controls -->
        <div class="controls" id="controls">
            <div class="controls-top">
                <button class="go-live" id="btnGoLive"><span class="gdot"></span>Go Live</button>
            </div>
            <div class="controls-bottom">
                <button class="cbtn vod-only" id="btnSkipBack" title="-10s" style="display:none;">⏪</button>
                <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
                <button class="cbtn vod-only" id="btnSkipFwd" title="+10s" style="display:none;">⏩</button>
                <span class="time-label vod-only" id="timeLabel" style="display:none;"></span>
                <button class="cbtn vod-only" id="btnSpeed" title="Playback speed" style="display:none; width:auto; padding:0 10px;">1x</button>
                <button class="cbtn" id="btnFullscreen" title="Fullscreen">⛶</button>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay" id="overlay">
            <div class="spinner" id="spinner"></div>
            <div class="msg" id="overlayMsg">Loading Please Wait...</div>
            <div id="endedBox" style="display:none; flex-direction:column; align-items:center; gap:10px;">
                <div class="ended-title">📺 Class Recorded</div>
                <div class="ended-sub">The live stream has ended — you can now watch or download the recording.</div>
                <div class="action-row">
                    <button class="big-btn watch" id="btnWatch">▶ Watch Online</button>
                    <a class="big-btn download" id="btnDownload" href="#" target="_blank" rel="noopener">⬇ Download Now</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>Made With ❤️</footer>

<!-- Secret owner-dashboard access icon — bas ek "doubt helper" jaisa dikhta hai -->
<button class="doubt-fab" id="doubtFab" title="📐" aria-label="Help">📐</button>

<div class="dmodal hidden" id="doubtConfirmModal">
    <div class="dmodal-card">
        <h2>Are you Sure to open?</h2>
        <div class="dmodal-actions">
            <button class="dmodal-btn yes" id="doubtYesBtn">YES</button>
            <button class="dmodal-btn no" id="doubtNoBtn">NO</button>
        </div>
    </div>
</div>

<script>
(function () {
    "use strict";

    var NAME = {{ name|tojson }};
    var INITIAL_STATUS = {{ status|tojson }};

    var video = document.getElementById("video");
    var shell = document.getElementById("shell");
    var overlay = document.getElementById("overlay");
    var overlayMsg = document.getElementById("overlayMsg");
    var spinner = document.getElementById("spinner");
    var endedBox = document.getElementById("endedBox");
    var btnWatch = document.getElementById("btnWatch");
    var btnDownload = document.getElementById("btnDownload");
    var liveBadge = document.getElementById("liveBadge");
    var controls = document.getElementById("controls");
    var btnFullscreen = document.getElementById("btnFullscreen");
    var btnGoLive = document.getElementById("btnGoLive");
    var btnSkipBack = document.getElementById("btnSkipBack");
    var btnSkipFwd = document.getElementById("btnSkipFwd");
    var btnSpeed = document.getElementById("btnSpeed");
    var progressBar = document.getElementById("progressBar");
    var progressWrap = document.getElementById("progressWrap");
    var timeLabel = document.getElementById("timeLabel");
    var bufferingPill = document.getElementById("bufferingPill");

    var hls = null;
    var isLive = true;
    var statusPoller = null;

    // Tracks whether playback has EVER actually started for this stream.
    // Needed to tell apart "stream never came up at all" (real failure —
    // should show an error) from "was playing fine, then errored near the
    // live edge" (probably the live class just ended).
    var manifestEverLoaded = false;
    var loadWatchdog = null;
    var LOAD_WATCHDOG_MS = 20000; // agar 20s me stream start na ho to error dikhao

    function clearLoadWatchdog() {
        if (loadWatchdog) { clearTimeout(loadWatchdog); loadWatchdog = null; }
    }
    function armLoadWatchdog() {
        clearLoadWatchdog();
        loadWatchdog = setTimeout(function () {
            if (!manifestEverLoaded) {
                showError("The stream won't start — the link has expired or the server is slow. Refresh after a while.");
            }
        }, LOAD_WATCHDOG_MS);
    }

    // ─────────── Overlay helpers ───────────
    function showLoading(msg) {
        overlay.classList.remove("hidden");
        spinner.style.display = "block";
        endedBox.style.display = "none";
        overlayMsg.style.display = "block";
        overlayMsg.textContent = msg;
        overlayMsg.className = "msg";
    }
    function showError(msg) {
        overlay.classList.remove("hidden");
        spinner.style.display = "none";
        overlayMsg.textContent = "✕ " + msg;
        overlayMsg.className = "msg error";
    }
    function hideOverlay() { overlay.classList.add("hidden"); }
    function showEnded(st) {
        overlay.classList.remove("hidden");
        spinner.style.display = "none";
        overlayMsg.style.display = "none";
        endedBox.style.display = "flex";
        btnDownload.href = st.download_url;
        btnWatch.onclick = function () {
            // Watch Online — same player, recorded mp4 (seek/speed/skip enabled)
            overlay.classList.add("hidden");
            isLive = false;
            btnGoLive.style.display = "none";
            document.querySelectorAll(".vod-only").forEach(function (el) {
                el.style.display = "";
            });
            if (hls) { hls.destroy(); hls = null; }
            video.src = st.watch_url;
            video.muted = false;
            video.playbackRate = 1;
            btnSpeed.textContent = "1x";
            video.play().catch(function () {});
            // Green "RECORDED" dot (replaces the red LIVE dot) — quality is
            // fixed at 480p (auto-selected, single-quality setup).
            liveBadge.querySelector("span").textContent = "RECORDED";
            liveBadge.classList.add("show", "recorded");
        };
    }

    // ─────────── Speed control (VOD only) ───────────
    var SPEEDS = [0.5, 1, 1.25, 1.5, 2];
    btnSpeed.addEventListener("click", function () {
        if (isLive) return;
        var idx = SPEEDS.indexOf(video.playbackRate);
        var next = SPEEDS[(idx + 1 + SPEEDS.length) % SPEEDS.length] || 1;
        video.playbackRate = next;
        btnSpeed.textContent = next + "x";
    });

    // ─────────── Skip ±10s (VOD only) ───────────
    btnSkipBack.addEventListener("click", function () {
        if (isLive || !video.duration) return;
        video.currentTime = Math.max(0, video.currentTime - 10);
    });
    btnSkipFwd.addEventListener("click", function () {
        if (isLive || !video.duration) return;
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
    });

    // ─────────── Status polling (live end detection) ───────────
    function startStatusPolling() {
        if (statusPoller) return;
        statusPoller = setInterval(function () {
            fetch("/api/status/" + encodeURIComponent(NAME))
                .then(function (r) { return r.json(); })
                .then(function (st) {
                    if (st.status === "READY") {
                        clearInterval(statusPoller);
                        statusPoller = null;
                        if (hls) { hls.destroy(); hls = null; }
                        showEnded(st);
                    }
                })
                .catch(function () {});
        }, 5000);
    }

    // ─────────── Live player ───────────
    var PLAYLIST_URL = "/api/live/" + encodeURIComponent(NAME) + "/playlist";

    function startLive() {
        showLoading("Live class load ho rahi hai…");

        if (typeof Hls === "undefined") {
            showError("Class didn't load — check your internet Connection.");
            return;
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90,
                liveSyncDurationCount: 3,
                liveMaxLatencyDurationCount: 8,
                manifestLoadingMaxRetry: 6,
                levelLoadingMaxRetry: 6,
                fragLoadingMaxRetry: 8,
                manifestLoadingRetryDelay: 1000,
                levelLoadingRetryDelay: 1000,
                fragLoadingRetryDelay: 1000,
                // ── Smoother playback / kam "atakna" (stalls) ──
                // Zyaada aage tak buffer karke rakho taaki thoda network
                // hiccup aane par bhi playback rukey nahi.
                maxBufferLength: 30,
                maxMaxBufferLength: 90,
                maxBufferSize: 90 * 1000 * 1000,
                maxBufferHole: 1,
                highBufferWatchdogPeriod: 1,
                nudgeMaxRetry: 8,
                nudgeOffset: 0.15,
            });

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                manifestEverLoaded = true;
                clearLoadWatchdog();
                // Reliable autoplay fix: kai browsers unmuted autoplay ko
                // silently BLOCK kar dete hain (play() promise reject ho
                // jaata hai) — video kabhi actually play hi nahi hota,
                // sirf pehla frame frozen dikhta rehta hai, aur "playing"
                // event kabhi fire nahi hota, isliye "Live class load ho
                // rahi hai…" overlay hata hi nahi. Fix: pehle MUTED
                // autoplay try karo (ye har browser allow karta hai) —
                // isse turant playback shuru ho jaata hai aur overlay turant
                // hat jaata hai — fir turant unmute try karo; agar unmute
                // se bhi browser rok de to muted hi rehne do (user tap se
                // khud unmute kar sakta hai, jaisa neeche click handler mein hai).
                video.muted = true;
                video.play().then(function () {
                    video.muted = false;
                    video.play().catch(function () {
                        video.muted = true; // unmuted na chala to muted hi theek
                    });
                }).catch(function () {
                    video.play().catch(function () {});
                });
            });

            // Playlist mein ENDLIST aa gaya → live khatam
            hls.on(Hls.Events.LEVEL_LOADED, function (_, data) {
                if (data.details && data.details.live === false) {
                    startStatusPolling();
                }
            });

            hls.on(Hls.Events.ERROR, function (_, data) {
                if (!data.fatal) return;

                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    // Use hls.js's own error "details" (matches the reference
                    // proxy's logic) instead of guessing — this is precise:
                    // manifestLoadError/manifestLoadTimeOut/manifestParsingError
                    // mean the playlist itself never came up even once (dead
                    // link, proxy 502, upstream down) — no point silently
                    // retrying forever, show a clear error immediately.
                    var neverStarted =
                        data.details === "manifestLoadError" ||
                        data.details === "manifestLoadTimeOut" ||
                        data.details === "manifestParsingError";

                    if (!manifestEverLoaded && neverStarted) {
                        showError("The stream failed to load — the link has expired or the server is down, Please refresh after a while.");
                        return;
                    }
                    if (!manifestEverLoaded) {
                        // Some other network error before first successful
                        // load — let hls.js's own retry policy handle it,
                        // don't manually reset the retry cycle.
                        return;
                    }
                    // Playback had already started once — a network error here
                    // near the live edge usually means the live class just ended.
                    startStatusPolling();
                    hls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hls.recoverMediaError();
                } else {
                    showError("Stream error — refresh the page after a while.");
                }
            });

            armLoadWatchdog();
            hls.loadSource(PLAYLIST_URL);
            hls.attachMedia(video);

        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
            video.src = PLAYLIST_URL; // Safari native HLS
            armLoadWatchdog();
            video.addEventListener("loadedmetadata", function () {
                manifestEverLoaded = true;
                clearLoadWatchdog();
                video.muted = true;
                video.play().then(function () {
                    video.muted = false;
                    video.play().catch(function () { video.muted = true; });
                }).catch(function () {});
            });
        } else {
            showError("HLS is not supported in this browser.");
        }
    }

    // ─────────── Video events ───────────
    // "playing" hamesha reliably fire ho ye guarantee nahi (kuch mobile
    // browsers mein flaky hota hai) — isliye "timeupdate" ko bhi ek backup
    // trigger banaya hai: jaise hi currentTime aage badhna shuru ho (matlab
    // video sach me play ho raha hai), overlay turant hata do — chahe
    // "playing" event mila ho ya na mila ho.
    function markActuallyPlaying() {
        if (isLive && !video.paused && !video.seeking) {
            hideOverlay();
            liveBadge.classList.add("show");
        }
    }
    video.addEventListener("playing", markActuallyPlaying);
    video.addEventListener("timeupdate", markActuallyPlaying);
    video.addEventListener("canplay", markActuallyPlaying);

    video.addEventListener("error", function () {
        if (video.getAttribute("src")) showError("Video error – please refresh and fix.");
    });

    // ─────────── Buffering indicator (video "atakne" par chhota indicator,
    // bada overlay dobara nahi — smooth feel ke liye) ───────────
    video.addEventListener("waiting", function () {
        if (!overlay.classList.contains("hidden")) return; // already loading overlay dikh raha hai
        bufferingPill.classList.add("show");
    });
    video.addEventListener("playing", function () {
        bufferingPill.classList.remove("show");
    });
    video.addEventListener("canplay", function () {
        bufferingPill.classList.remove("show");
    });

    // Live class ki speed hamesha 1x — kisi bhi tarah (native context menu,
    // keyboard shortcut, etc.) se change ho jaaye to turant wapas 1x kar do.
    video.addEventListener("ratechange", function () {
        if (isLive && video.playbackRate !== 1) video.playbackRate = 1;
    });

    // ─────────── Tap-to-play/pause (video par seedha tap — professional
    // style, koi persistent pause button nahi) ───────────
    video.addEventListener("click", function () {
        video.muted = false; // pehle tap par hi unmute (agar autoplay policy ki wajah se mute tha)
        if (video.paused) video.play().catch(function () {});
        else video.pause();
    });

    // ─────────── Custom controls ───────────
    btnFullscreen.addEventListener("click", function () {
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else if (shell.requestFullscreen) {
            shell.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen(); // iOS Safari
        }
    });

    // Fullscreen tap → force LANDSCAPE orientation (better viewing on
    // mobile); tap fullscreen again (exit) → automatically back to normal
    // PORTRAIT. screen.orientation.lock() sirf fullscreen ke andar hi kaam
    // karta hai (browser requirement) — isliye enter/exit dono par handle
    // karte hain. Agar browser support na kare (e.g. desktop / iOS Safari)
    // to silently ignore ho jaata hai, koi error nahi.
    document.addEventListener("fullscreenchange", function () {
        if (document.fullscreenElement) {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(function () {});
            }
        } else {
            if (screen.orientation && screen.orientation.unlock) {
                try { screen.orientation.unlock(); } catch (e) {}
            }
        }
    });

    // Go Live — live edge pe jump
    function updateGoLiveState() {
        if (!isLive) return;
        var atLive = false;
        if (hls && hls.liveSyncPosition) {
            atLive = Math.abs(video.currentTime - hls.liveSyncPosition) < 8;
        }
        btnGoLive.classList.toggle("at-live", atLive);
    }
    btnGoLive.addEventListener("click", function () {
        if (!isLive) return;
        var edge = null;
        if (hls && hls.liveSyncPosition) edge = hls.liveSyncPosition;
        else if (video.seekable.length) edge = video.seekable.end(video.seekable.length - 1);
        if (edge != null) {
            video.currentTime = edge;
            video.play().catch(function () {});
        }
    });

    // Progress bar (recorded mode mein seek, live mode mein DVR buffer
    // position — user is bhi drag/tap karke live buffer ke andar
    // aage-pichhe ja sakta hai, jaisे koi late-join karke miss hui shuruaat
    // dekhna chahe. Go Live button hamesha turant live edge par le jaata hai.)
    setInterval(function () {
        try {
            if (isLive) {
                if (video.seekable.length) {
                    var end = video.seekable.end(video.seekable.length - 1);
                    var start = video.seekable.start(0);
                    var pct = end > start ? ((video.currentTime - start) / (end - start)) * 100 : 0;
                    progressBar.style.width = Math.min(100, Math.max(0, pct)) + "%";
                    // Live DVR window ke andar "kitna peeche hai" dikhane ke liye
                    // chhota running time counter (jaisa reference mein tha).
                    timeLabel.style.display = "";
                    timeLabel.textContent = fmt(video.currentTime - start) + " / " + fmt(end - start);
                }
                updateGoLiveState();
            } else if (video.duration) {
                progressBar.style.width = (video.currentTime / video.duration) * 100 + "%";
                timeLabel.textContent = fmt(video.currentTime) + " / " + fmt(video.duration);
            }
        } catch (e) {}
    }, 500);

    function fmt(s) {
        s = Math.floor(s || 0);
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
    }

    function seekFromEvent(clientX) {
        var rect = progressWrap.getBoundingClientRect();
        var ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        if (isLive) {
            if (!video.seekable.length) return;
            var start = video.seekable.start(0);
            var end = video.seekable.end(video.seekable.length - 1);
            video.currentTime = start + ratio * (end - start);
        } else {
            if (!video.duration) return;
            video.currentTime = ratio * video.duration;
        }
    }

    progressWrap.addEventListener("click", function (e) {
        seekFromEvent(e.clientX);
    });

    // Touch/drag support — mobile par bhi smoothly scrub kar sake, sirf
    // tap nahi.
    var scrubbing = false;
    progressWrap.addEventListener("pointerdown", function (e) {
        scrubbing = true;
        seekFromEvent(e.clientX);
    });
    window.addEventListener("pointermove", function (e) {
        if (!scrubbing) return;
        seekFromEvent(e.clientX);
    });
    window.addEventListener("pointerup", function () { scrubbing = false; });

    // ─────────── Secret owner-dashboard access (📐 icon) ───────────
    // NOTE (intentional): "YES" simply closes the popup (does nothing) so a
    // curious student tapping the obvious-looking button learns nothing.
    // "NO" is what actually opens the Owner Dashboard — the real dashboard
    // route itself still requires the admin session, so even if someone
    // stumbles onto "NO" they just get redirected to the login page.
    var doubtFab = document.getElementById("doubtFab");
    var doubtConfirmModal = document.getElementById("doubtConfirmModal");
    doubtFab.addEventListener("click", function () {
        doubtConfirmModal.classList.remove("hidden");
    });
    document.getElementById("doubtYesBtn").addEventListener("click", function () {
        doubtConfirmModal.classList.add("hidden");
    });
    document.getElementById("doubtNoBtn").addEventListener("click", function () {
        window.location.href = "/owner/" + encodeURIComponent(NAME);
    });

    // ─────────── Boot ───────────
    if (INITIAL_STATUS === "READY") {
        // Pehle se recorded hai — seedha 2 options dikhao
        fetch("/api/status/" + encodeURIComponent(NAME))
            .then(function (r) { return r.json(); })
            .then(function (st) { if (st.status === "READY") showEnded(st); else startLive(); })
            .catch(function () { startLive(); });
    } else {
        startLive();
    }
})();
</script>
</body>
</html>
